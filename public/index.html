<!DOCTYPE html>
<html>
<head>
    <title>Stress Test Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier New', monospace; background: #000; color: #0f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; font-size: 2em; margin-bottom: 20px; border: 2px solid #0f0; padding: 15px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat { border: 1px solid #0f0; padding: 10px; text-align: center; }
        .stat-value { font-size: 1.5em; font-weight: bold; }
        .stat-label { font-size: 0.8em; opacity: 0.7; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px; }
        .card { border: 1px solid #0f0; padding: 15px; }
        .card h2 { font-size: 1em; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #0f0; }
        .btn { background: #000; border: 1px solid #0f0; color: #0f0; padding: 8px 15px; cursor: pointer; margin: 3px; font-family: inherit; font-size: 12px; }
        .btn:hover { background: #0f0; color: #000; }
        .btn.danger { border-color: #f00; color: #f00; }
        .btn.danger:hover { background: #f00; color: #000; }
        .output { background: #000; border: 1px solid #0f0; padding: 10px; margin-top: 10px; font-size: 11px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        input { background: #000; border: 1px solid #0f0; color: #0f0; padding: 8px; font-family: inherit; width: 180px; margin: 3px; }
        input::placeholder { color: #060; }
        .progress { height: 3px; background: #030; margin-top: 10px; }
        .progress-bar { height: 100%; background: #0f0; width: 0%; }
        .running { color: #ff0; }
        .success { color: #0f0; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ STRESS TEST SUITE ]</h1>
        
        <div class="stats">
            <div class="stat"><div class="stat-value" id="totalTests">0</div><div class="stat-label">TESTS</div></div>
            <div class="stat"><div class="stat-value" id="avgTime">0ms</div><div class="stat-label">AVG TIME</div></div>
            <div class="stat"><div class="stat-value" id="successRate">0%</div><div class="stat-label">SUCCESS</div></div>
            <div class="stat"><div class="stat-value" id="activeTests">0</div><div class="stat-label">ACTIVE</div></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>[ CPU ]</h2>
                <button class="btn" onclick="runTest('/api/cpu/hash?iterations=100000')">HASH 100K</button>
                <button class="btn danger" onclick="runTest('/api/cpu/hash?iterations=1000000')">HASH 1M</button>
                <button class="btn" onclick="runTest('/api/cpu/prime?limit=100000')">PRIME 100K</button>
                <button class="btn danger" onclick="runTest('/api/cpu/fibonacci?n=45')">FIB(45)</button>
                <div class="output" id="cpu-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ MEMORY ]</h2>
                <button class="btn" onclick="runTest('/api/memory/allocate?size=50')">ALLOC 50MB</button>
                <button class="btn" onclick="runTest('/api/memory/allocate?size=200')">ALLOC 200MB</button>
                <button class="btn danger" onclick="runTest('/api/memory/allocate?size=500')">ALLOC 500MB</button>
                <button class="btn danger" onclick="runTest('/api/memory/leak?count=50000')">LEAK 50K</button>
                <div class="output" id="memory-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ NETWORK / SSRF ]</h2>
                <input type="text" id="ssrf-url" value="http://169.254.169.254/latest/meta-data/" placeholder="URL">
                <button class="btn danger" onclick="runTest('/api/network/fetch?url=' + encodeURIComponent(document.getElementById('ssrf-url').value))">SSRF</button>
                <button class="btn" onclick="runTest('/api/network/dns?host=kubernetes.default.svc.cluster.local')">K8S DNS</button>
                <button class="btn" onclick="runTest('/api/network/scan?host=10.100.0.1')">PORT SCAN</button>
                <div class="output" id="network-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ SYSTEM / RCE ]</h2>
                <button class="btn" onclick="runTest('/api/system/info')">SYSINFO</button>
                <button class="btn" onclick="runTest('/api/reverse/check')">REV CHECK</button>
                <input type="text" id="cmd" value="id" placeholder="Command">
                <button class="btn danger" onclick="runTest('/api/system/exec?cmd=' + encodeURIComponent(document.getElementById('cmd').value))">EXEC</button>
                <div class="output" id="system-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ FILESYSTEM ]</h2>
                <button class="btn" onclick="runTest('/api/fs/write?size=10')">WRITE 10MB</button>
                <button class="btn" onclick="runTest('/api/fs/write?size=100')">WRITE 100MB</button>
                <input type="text" id="filepath" value="/etc/passwd" placeholder="Path">
                <button class="btn" onclick="runTest('/api/fs/read?path=' + encodeURIComponent(document.getElementById('filepath').value))">READ</button>
                <button class="btn danger" onclick="runTest('/api/fs/read?path=/var/run/secrets/kubernetes.io/serviceaccount/token')">K8S TOKEN</button>
                <div class="output" id="fs-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ LOAD TEST ]</h2>
                <button class="btn" onclick="runTest('/api/load/concurrent?count=100')">100 REQ</button>
                <button class="btn" onclick="runTest('/api/load/concurrent?count=1000')">1000 REQ</button>
                <button class="btn danger" onclick="stressTest(50)">RAPID 50</button>
                <button class="btn danger" onclick="stressTest(200)">STRESS 200</button>
                <div class="progress"><div class="progress-bar" id="load-progress"></div></div>
                <div class="output" id="load-output">&gt; Ready</div>
            </div>
        </div>
    </div>

    <script>
        let stats = { total: 0, success: 0, times: [], active: 0 };

        function updateStats(time, success) {
            stats.total++;
            if (success) stats.success++;
            stats.times.push(time);
            if (stats.times.length > 100) stats.times.shift();
            document.getElementById('totalTests').textContent = stats.total;
            document.getElementById('avgTime').textContent = Math.round(stats.times.reduce((a,b) => a+b, 0) / stats.times.length) + 'ms';
            document.getElementById('successRate').textContent = Math.round(stats.success / stats.total * 100) + '%';
            document.getElementById('activeTests').textContent = stats.active;
        }

        async function runTest(endpoint) {
            const category = endpoint.includes('cpu') ? 'cpu' : endpoint.includes('memory') ? 'memory' : endpoint.includes('network') ? 'network' : endpoint.includes('system') || endpoint.includes('reverse') ? 'system' : endpoint.includes('fs') ? 'fs' : 'load';
            const output = document.getElementById(category + '-output');
            output.innerHTML = '<span class="running">&gt; Running...</span>';
            stats.active++;
            document.getElementById('activeTests').textContent = stats.active;
            const start = Date.now();
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                const time = Date.now() - start;
                output.innerHTML = '<span class="success">&gt; OK ' + time + 'ms</span>\n' + JSON.stringify(data, null, 2);
                updateStats(time, true);
            } catch (e) {
                const time = Date.now() - start;
                output.innerHTML = '<span class="error">&gt; ERR ' + time + 'ms</span>\n' + e.message;
                updateStats(time, false);
            }
            stats.active--;
            document.getElementById('activeTests').textContent = stats.active;
        }

        async function stressTest(count) {
            const output = document.getElementById('load-output');
            const progress = document.getElementById('load-progress');
            output.innerHTML = '<span class="running">&gt; Running ' + count + ' requests...</span>';
            const start = Date.now();
            let completed = 0, successes = 0;
            const promises = [];
            for (let i = 0; i < count; i++) {
                promises.push(fetch('/api/cpu/hash?iterations=10000').then(r => { successes++; return r; }).catch(() => {}).finally(() => { completed++; progress.style.width = (completed / count * 100) + '%'; }));
            }
            await Promise.all(promises);
            const time = Date.now() - start;
            output.innerHTML = '<span class="success">&gt; DONE</span>\nRequests: ' + count + '\nSuccess: ' + successes + '\nTime: ' + time + 'ms\nRPS: ' + Math.round(count / time * 1000);
        }
    </script>
</body>
</html>

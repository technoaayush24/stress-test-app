<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Test Suite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <style>
        :root { --green: #0f0; --dark: #003300; --bg: #0a0a0a; --red: #f33; --yellow: #ff0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--green); min-height: 100vh; padding: 16px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; border: 2px solid var(--green); padding: 12px 40px; font-weight: normal; }
        .terminal-btn { position: absolute; right: 0; background: var(--bg); border: 2px solid var(--green); color: var(--green); width: 44px; height: 44px; cursor: pointer; font-size: 1.2rem; }
        .terminal-btn:hover, .terminal-btn.active { background: var(--green); color: var(--bg); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .stat { border: 1px solid var(--green); padding: 12px; text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card { border: 1px solid var(--green); padding: 12px; min-height: 220px; display: flex; flex-direction: column; }
        .card h2 { font-size: 0.85rem; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--dark); font-weight: normal; }
        .card-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .card-input { display: flex; gap: 4px; margin-bottom: 8px; }
        .btn { background: var(--bg); border: 1px solid var(--green); color: var(--green); padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 0.75rem; }
        .btn:hover { background: var(--green); color: var(--bg); }
        .btn.danger { border-color: var(--red); color: var(--red); }
        .btn.danger:hover { background: var(--red); color: var(--bg); }
        .output { background: #050505; border: 1px solid var(--dark); padding: 8px; font-size: 0.7rem; height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; flex: 1; }
        input[type="text"] { background: var(--bg); border: 1px solid var(--green); color: var(--green); padding: 6px 8px; font-family: inherit; font-size: 0.75rem; flex: 1; min-width: 0; }
        input::placeholder { color: var(--dark); }
        input:focus { outline: none; background: #001100; }
        .progress { height: 3px; background: #111; margin: 8px 0; }
        .progress-bar { height: 100%; background: var(--green); width: 0%; transition: width 0.2s; }
        .running { color: var(--yellow); }
        .success { color: var(--green); }
        .error { color: var(--red); }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: #000; border: 2px solid var(--green); width: 100%; max-width: 1100px; height: 85vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--dark); background: #0a0a0a; }
        .modal-header h2 { font-size: 0.9rem; font-weight: normal; }
        .modal-header .status { font-size: 0.75rem; opacity: 0.7; }
        .modal-header .status.connected { color: var(--green); }
        .modal-header .status.disconnected { color: var(--red); }
        .modal-close { background: none; border: 1px solid var(--green); color: var(--green); width: 28px; height: 28px; cursor: pointer; font-size: 1rem; }
        .modal-close:hover { background: var(--green); color: var(--bg); }
        .terminal-container { flex: 1; padding: 4px; overflow: hidden; }
        
        @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--dark); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>[ STRESS TEST ]</h1>
            <button class="terminal-btn" id="termBtn" onclick="toggleTerminal()" title="Terminal (Ctrl+`)">⌘</button>
        </div>
        
        <div class="stats">
            <div class="stat"><div class="stat-value" id="totalTests">0</div><div class="stat-label">TESTS</div></div>
            <div class="stat"><div class="stat-value" id="avgTime">0ms</div><div class="stat-label">AVG</div></div>
            <div class="stat"><div class="stat-value" id="successRate">0%</div><div class="stat-label">SUCCESS</div></div>
            <div class="stat"><div class="stat-value" id="activeTests">0</div><div class="stat-label">ACTIVE</div></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>[ CPU ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/cpu/hash?iterations=100000')">HASH 100K</button>
                    <button class="btn danger" onclick="runTest('/api/cpu/hash?iterations=1000000')">HASH 1M</button>
                    <button class="btn" onclick="runTest('/api/cpu/prime?limit=100000')">PRIME 100K</button>
                    <button class="btn danger" onclick="runTest('/api/cpu/fibonacci?n=45')">FIB(45)</button>
                </div>
                <div class="output" id="cpu-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ MEMORY ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/memory/allocate?size=50')">ALLOC 50MB</button>
                    <button class="btn" onclick="runTest('/api/memory/allocate?size=200')">ALLOC 200MB</button>
                    <button class="btn danger" onclick="runTest('/api/memory/allocate?size=500')">ALLOC 500MB</button>
                    <button class="btn danger" onclick="runTest('/api/memory/leak?count=50000')">LEAK 50K</button>
                </div>
                <div class="output" id="memory-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ NETWORK / SSRF ]</h2>
                <div class="card-input">
                    <input type="text" id="ssrf-url" value="http://169.254.169.254/latest/meta-data/" placeholder="URL">
                    <button class="btn danger" onclick="runTest('/api/network/fetch?url=' + encodeURIComponent(document.getElementById('ssrf-url').value))">SSRF</button>
                </div>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/network/dns?host=kubernetes.default.svc.cluster.local')">K8S DNS</button>
                    <button class="btn" onclick="runTest('/api/network/scan?host=10.100.0.1')">PORT SCAN</button>
                </div>
                <div class="output" id="network-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ FILESYSTEM ]</h2>
                <div class="card-input">
                    <input type="text" id="filepath" value="/etc/passwd" placeholder="Path">
                    <button class="btn" onclick="runTest('/api/fs/read?path=' + encodeURIComponent(document.getElementById('filepath').value))">READ</button>
                </div>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/fs/write?size=10')">WRITE 10MB</button>
                    <button class="btn" onclick="runTest('/api/fs/write?size=100')">WRITE 100MB</button>
                    <button class="btn danger" onclick="runTest('/api/fs/read?path=/var/run/secrets/kubernetes.io/serviceaccount/token')">K8S TOKEN</button>
                </div>
                <div class="output" id="fs-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ LOAD TEST ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/load/concurrent?count=100')">100 REQ</button>
                    <button class="btn" onclick="runTest('/api/load/concurrent?count=1000')">1K REQ</button>
                    <button class="btn danger" onclick="stressTest(50)">RAPID 50</button>
                    <button class="btn danger" onclick="stressTest(200)">STRESS 200</button>
                </div>
                <div class="progress"><div class="progress-bar" id="load-progress"></div></div>
                <div class="output" id="load-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ SYSTEM ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/system/info')">FULL INFO</button>
                    <button class="btn" onclick="runTest('/api/reverse/check')">REV CHECK</button>
                    <button class="btn" onclick="runTest('/api/network/dns?host=kube-dns.kube-system.svc.cluster.local')">KUBE-DNS</button>
                </div>
                <div class="output" id="system-output">&gt; Ready</div>
            </div>
        </div>
    </div>

    <!-- Terminal Modal -->
    <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeTerminal()">
        <div class="modal">
            <div class="modal-header">
                <h2>[ SHELL ]</h2>
                <span class="status disconnected" id="connStatus">● Disconnected</span>
                <button class="modal-close" onclick="closeTerminal()">✕</button>
            </div>
            <div class="terminal-container" id="terminal"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const stats = { total: 0, success: 0, times: [], active: 0 };
        let term = null, ws = null, fitAddon = null;

        function updateStats(time, ok) {
            stats.total++; if(ok) stats.success++;
            stats.times.push(time); if(stats.times.length > 100) stats.times.shift();
            $('totalTests').textContent = stats.total;
            $('avgTime').textContent = Math.round(stats.times.reduce((a,b)=>a+b,0)/stats.times.length) + 'ms';
            $('successRate').textContent = Math.round(stats.success/stats.total*100) + '%';
            $('activeTests').textContent = stats.active;
        }

        async function runTest(endpoint) {
            const cat = endpoint.includes('/cpu') ? 'cpu' : endpoint.includes('/memory') ? 'memory' : 
                       endpoint.includes('/network') || endpoint.includes('/reverse') ? 'network' : 
                       endpoint.includes('/system') ? 'system' : endpoint.includes('/fs') ? 'fs' : 'load';
            const out = $(cat + '-output');
            out.innerHTML = '<span class="running">&gt; Running...</span>';
            stats.active++; $('activeTests').textContent = stats.active;
            const start = Date.now();
            try {
                const r = await fetch(endpoint);
                const d = await r.json();
                const t = Date.now() - start;
                out.innerHTML = '<span class="success">&gt; OK ' + t + 'ms</span>\n' + JSON.stringify(d, null, 2);
                updateStats(t, true);
            } catch (e) {
                out.innerHTML = '<span class="error">&gt; ERR</span>\n' + e.message;
                updateStats(Date.now() - start, false);
            }
            stats.active--; $('activeTests').textContent = stats.active;
        }

        async function stressTest(n) {
            const out = $('load-output'), prog = $('load-progress');
            out.innerHTML = '<span class="running">&gt; Running...</span>'; prog.style.width = '0%';
            const start = Date.now(); let done = 0, ok = 0;
            await Promise.all(Array.from({length:n}, () => 
                fetch('/api/cpu/hash?iterations=10000').then(()=>ok++).catch(()=>{}).finally(()=>{ done++; prog.style.width = (done/n*100)+'%'; })
            ));
            const t = Date.now() - start;
            out.innerHTML = '<span class="success">&gt; DONE</span>\n' + n + ' req | ' + ok + ' ok | ' + t + 'ms | ' + Math.round(n/t*1000) + ' rps';
        }

        // Real WebSocket Terminal
        function initTerminal() {
            if (term) return;
            
            term = new Terminal({
                cursorBlink: true,
                fontSize: 15,
                fontFamily: 'Consolas, Monaco, "Courier New", monospace',
                theme: {
                    background: '#000000',
                    foreground: '#00ff00',
                    cursor: '#00ff00',
                    cursorAccent: '#000000',
                    selectionBackground: '#003300'
                },
                allowProposedApi: true
            });
            
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.loadAddon(new WebLinksAddon.WebLinksAddon());
            
            term.open($('terminal'));
            fitAddon.fit();
            
            window.addEventListener('resize', () => {
                if (fitAddon && $('modal').classList.contains('open')) {
                    fitAddon.fit();
                }
            });
        }
        
        function connectWS() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + location.host + '/ws/terminal');
            
            ws.onopen = () => {
                $('connStatus').textContent = '● Connected';
                $('connStatus').className = 'status connected';
                term.focus();
            };
            
            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'output') {
                        term.write(msg.data);
                    } else if (msg.type === 'exit') {
                        term.writeln('\r\n[Shell exited with code ' + msg.code + ']');
                        $('connStatus').textContent = '● Disconnected';
                        $('connStatus').className = 'status disconnected';
                    }
                } catch {
                    term.write(e.data);
                }
            };
            
            ws.onclose = () => {
                $('connStatus').textContent = '● Disconnected';
                $('connStatus').className = 'status disconnected';
            };
            
            ws.onerror = () => {
                term.writeln('\r\n[Connection error]');
            };
            
            // Send terminal input to server
            term.onData(data => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'input', data }));
                }
            });
        }

        function toggleTerminal() { 
            $('modal').classList.contains('open') ? closeTerminal() : openTerminal(); 
        }
        
        function openTerminal() {
            $('modal').classList.add('open');
            $('termBtn').classList.add('active');
            initTerminal();
            setTimeout(() => {
                fitAddon.fit();
                connectWS();
            }, 100);
        }
        
        function closeTerminal() {
            $('modal').classList.remove('open');
            $('termBtn').classList.remove('active');
        }
        
        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key === '`') { e.preventDefault(); toggleTerminal(); }
            if (e.key === 'Escape' && $('modal').classList.contains('open')) closeTerminal();
        });
        
        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Test Suite</title>
    <style>
        :root {
            --green: #00ff00;
            --dark-green: #003300;
            --bg: #0a0a0a;
            --border: #00ff00;
            --red: #ff3333;
            --yellow: #ffff00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 14px; }
        body { 
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; 
            background: var(--bg); 
            color: var(--green); 
            min-height: 100vh; 
            padding: 16px;
            line-height: 1.4;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        h1 { 
            text-align: center; 
            font-size: 1.5rem; 
            margin-bottom: 16px; 
            border: 2px solid var(--border); 
            padding: 12px;
            font-weight: normal;
            letter-spacing: 2px;
        }
        
        /* Stats - fixed height */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 16px;
            height: 70px;
        }
        .stat { 
            border: 1px solid var(--border); 
            padding: 8px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-value { font-size: 1.4rem; font-weight: bold; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; margin-top: 2px; }
        
        /* Grid layout */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px;
        }
        
        /* Cards - fixed dimensions */
        .card { 
            border: 1px solid var(--border); 
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }
        .card h2 { 
            font-size: 0.85rem; 
            margin-bottom: 10px; 
            padding-bottom: 6px; 
            border-bottom: 1px solid var(--dark-green);
            font-weight: normal;
            flex-shrink: 0;
        }
        .card-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
            flex-shrink: 0;
            min-height: 36px;
        }
        .card-input {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        
        /* Buttons */
        .btn { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--green); 
            padding: 6px 12px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 0.75rem;
            transition: all 0.1s ease;
            white-space: nowrap;
        }
        .btn:hover { background: var(--green); color: var(--bg); }
        .btn:active { transform: scale(0.98); }
        .btn.danger { border-color: var(--red); color: var(--red); }
        .btn.danger:hover { background: var(--red); color: var(--bg); }
        
        /* Output - fixed height with scroll */
        .output { 
            background: #050505; 
            border: 1px solid var(--dark-green); 
            padding: 8px; 
            font-size: 0.7rem; 
            height: 120px;
            overflow-y: auto; 
            white-space: pre-wrap; 
            word-break: break-all;
            flex-grow: 1;
        }
        
        /* Input */
        input[type="text"] { 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--green); 
            padding: 6px 8px; 
            font-family: inherit;
            font-size: 0.75rem;
            flex: 1;
            min-width: 0;
        }
        input::placeholder { color: var(--dark-green); }
        input:focus { outline: none; background: #001100; }
        
        /* Progress */
        .progress { height: 3px; background: #111; margin: 8px 0; flex-shrink: 0; }
        .progress-bar { height: 100%; background: var(--green); width: 0%; transition: width 0.2s; }
        
        /* Status colors */
        .running { color: var(--yellow); }
        .success { color: var(--green); }
        .error { color: var(--red); }
        
        /* Terminal card - spans full width */
        .terminal-card { 
            grid-column: 1 / -1;
            min-height: 350px;
        }
        .terminal { 
            background: #050505; 
            border: 1px solid var(--dark-green); 
            flex-grow: 1;
            display: flex; 
            flex-direction: column;
            min-height: 280px;
        }
        .terminal-output { 
            flex: 1; 
            padding: 10px; 
            overflow-y: auto; 
            font-size: 0.8rem; 
            line-height: 1.5;
            min-height: 200px;
        }
        .terminal-input-line { 
            display: flex; 
            border-top: 1px solid var(--dark-green);
            flex-shrink: 0;
        }
        .terminal-prompt { 
            padding: 10px; 
            color: var(--green); 
            white-space: nowrap;
            font-size: 0.8rem;
        }
        .terminal-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: var(--green); 
            padding: 10px 10px 10px 0; 
            font-family: inherit; 
            font-size: 0.8rem; 
            outline: none;
        }
        
        /* Responsive */
        @media (max-width: 1000px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 650px) {
            .grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); height: auto; }
            h1 { font-size: 1.2rem; }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--dark-green); }
        ::-webkit-scrollbar-thumb:hover { background: var(--green); }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ STRESS TEST SUITE ]</h1>
        
        <div class="stats">
            <div class="stat"><div class="stat-value" id="totalTests">0</div><div class="stat-label">TESTS</div></div>
            <div class="stat"><div class="stat-value" id="avgTime">0ms</div><div class="stat-label">AVG TIME</div></div>
            <div class="stat"><div class="stat-value" id="successRate">0%</div><div class="stat-label">SUCCESS</div></div>
            <div class="stat"><div class="stat-value" id="activeTests">0</div><div class="stat-label">ACTIVE</div></div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>[ CPU ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/cpu/hash?iterations=100000')">HASH 100K</button>
                    <button class="btn danger" onclick="runTest('/api/cpu/hash?iterations=1000000')">HASH 1M</button>
                    <button class="btn" onclick="runTest('/api/cpu/prime?limit=100000')">PRIME 100K</button>
                    <button class="btn danger" onclick="runTest('/api/cpu/fibonacci?n=45')">FIB(45)</button>
                </div>
                <div class="output" id="cpu-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ MEMORY ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/memory/allocate?size=50')">ALLOC 50MB</button>
                    <button class="btn" onclick="runTest('/api/memory/allocate?size=200')">ALLOC 200MB</button>
                    <button class="btn danger" onclick="runTest('/api/memory/allocate?size=500')">ALLOC 500MB</button>
                    <button class="btn danger" onclick="runTest('/api/memory/leak?count=50000')">LEAK 50K</button>
                </div>
                <div class="output" id="memory-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ NETWORK / SSRF ]</h2>
                <div class="card-input">
                    <input type="text" id="ssrf-url" value="http://169.254.169.254/latest/meta-data/" placeholder="URL">
                    <button class="btn danger" onclick="runTest('/api/network/fetch?url=' + encodeURIComponent(document.getElementById('ssrf-url').value))">SSRF</button>
                </div>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/network/dns?host=kubernetes.default.svc.cluster.local')">K8S DNS</button>
                    <button class="btn" onclick="runTest('/api/network/scan?host=10.100.0.1')">PORT SCAN</button>
                </div>
                <div class="output" id="network-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ FILESYSTEM ]</h2>
                <div class="card-input">
                    <input type="text" id="filepath" value="/etc/passwd" placeholder="Path">
                    <button class="btn" onclick="runTest('/api/fs/read?path=' + encodeURIComponent(document.getElementById('filepath').value))">READ</button>
                </div>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/fs/write?size=10')">WRITE 10MB</button>
                    <button class="btn" onclick="runTest('/api/fs/write?size=100')">WRITE 100MB</button>
                    <button class="btn danger" onclick="runTest('/api/fs/read?path=/var/run/secrets/kubernetes.io/serviceaccount/token')">K8S TOKEN</button>
                </div>
                <div class="output" id="fs-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ LOAD TEST ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/load/concurrent?count=100')">100 REQ</button>
                    <button class="btn" onclick="runTest('/api/load/concurrent?count=1000')">1K REQ</button>
                    <button class="btn danger" onclick="stressTest(50)">RAPID 50</button>
                    <button class="btn danger" onclick="stressTest(200)">STRESS 200</button>
                </div>
                <div class="progress"><div class="progress-bar" id="load-progress"></div></div>
                <div class="output" id="load-output">&gt; Ready</div>
            </div>

            <div class="card">
                <h2>[ SYSTEM ]</h2>
                <div class="card-buttons">
                    <button class="btn" onclick="runTest('/api/system/info')">FULL INFO</button>
                    <button class="btn" onclick="runTest('/api/reverse/check')">REV CHECK</button>
                    <button class="btn" onclick="runTest('/api/network/dns?host=kube-dns.kube-system.svc.cluster.local')">KUBE-DNS</button>
                </div>
                <div class="output" id="system-output">&gt; Ready</div>
            </div>

            <div class="card terminal-card">
                <h2>[ SHELL ]</h2>
                <div class="terminal">
                    <div class="terminal-output" id="term-output"></div>
                    <div class="terminal-input-line">
                        <span class="terminal-prompt" id="term-prompt">$</span>
                        <input type="text" class="terminal-input" id="term-input" placeholder="Enter command..." autofocus>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const stats = { total: 0, success: 0, times: [], active: 0 };
        const cmdHistory = [];
        let historyIndex = -1;
        let cwd = '/app';

        const $ = id => document.getElementById(id);

        function updateStats(time, success) {
            stats.total++;
            if (success) stats.success++;
            stats.times.push(time);
            if (stats.times.length > 100) stats.times.shift();
            $('totalTests').textContent = stats.total;
            $('avgTime').textContent = Math.round(stats.times.reduce((a,b) => a+b, 0) / stats.times.length) + 'ms';
            $('successRate').textContent = Math.round(stats.success / stats.total * 100) + '%';
            $('activeTests').textContent = stats.active;
        }

        async function runTest(endpoint) {
            const cats = {cpu:1, memory:1, network:1, dns:1, system:1, reverse:1, fs:1, load:1};
            let cat = 'load';
            for (const c in cats) if (endpoint.includes(c)) { cat = c === 'dns' || c === 'reverse' ? (endpoint.includes('system') ? 'system' : 'network') : c; break; }
            if (endpoint.includes('/api/system')) cat = 'system';
            
            const output = $(cat + '-output');
            output.innerHTML = '<span class="running">&gt; Running...</span>';
            stats.active++;
            $('activeTests').textContent = stats.active;
            
            const start = Date.now();
            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                const time = Date.now() - start;
                output.innerHTML = '<span class="success">&gt; OK ' + time + 'ms</span>\n' + JSON.stringify(data, null, 2);
                updateStats(time, true);
            } catch (e) {
                const time = Date.now() - start;
                output.innerHTML = '<span class="error">&gt; ERR ' + time + 'ms</span>\n' + e.message;
                updateStats(time, false);
            }
            stats.active--;
            $('activeTests').textContent = stats.active;
        }

        async function stressTest(count) {
            const output = $('load-output');
            const progress = $('load-progress');
            output.innerHTML = '<span class="running">&gt; Running ' + count + ' requests...</span>';
            progress.style.width = '0%';
            
            const start = Date.now();
            let completed = 0, successes = 0;
            
            await Promise.all(Array.from({length: count}, () => 
                fetch('/api/cpu/hash?iterations=10000')
                    .then(() => successes++)
                    .catch(() => {})
                    .finally(() => {
                        completed++;
                        progress.style.width = (completed / count * 100) + '%';
                    })
            ));
            
            const time = Date.now() - start;
            output.innerHTML = '<span class="success">&gt; DONE</span>\nRequests: ' + count + '\nSuccess: ' + successes + '\nTime: ' + time + 'ms\nRPS: ' + Math.round(count / time * 1000);
        }

        // Terminal
        const termOutput = $('term-output');
        const termInput = $('term-input');
        const termPrompt = $('term-prompt');

        function updatePrompt() {
            const short = cwd.length > 30 ? '...' + cwd.slice(-27) : cwd;
            termPrompt.textContent = short + ' $';
        }

        function appendOutput(text, cls = '') {
            const line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = text;
            termOutput.appendChild(line);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        async function executeCommand(cmd) {
            if (!cmd.trim()) return;
            
            cmdHistory.push(cmd);
            historyIndex = cmdHistory.length;
            appendOutput(cwd + ' $ ' + cmd, 'success');
            
            if (cmd.startsWith('cd ')) {
                const dir = cmd.slice(3).trim() || '/';
                try {
                    const res = await fetch('/api/shell/cd?dir=' + encodeURIComponent(dir) + '&cwd=' + encodeURIComponent(cwd));
                    const data = await res.json();
                    if (data.success) { cwd = data.cwd; updatePrompt(); }
                    else appendOutput(data.error, 'error');
                } catch (e) { appendOutput('cd: ' + e.message, 'error'); }
                return;
            }
            
            if (cmd === 'clear' || cmd === 'cls') { termOutput.innerHTML = ''; return; }
            
            try {
                const res = await fetch('/api/shell/exec', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cmd, cwd })
                });
                const data = await res.json();
                if (data.output) appendOutput(data.output);
                if (data.error) appendOutput(data.error, 'error');
            } catch (e) { appendOutput('Error: ' + e.message, 'error'); }
        }

        termInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = termInput.value;
                termInput.value = '';
                await executeCommand(cmd);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) termInput.value = cmdHistory[--historyIndex];
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < cmdHistory.length - 1) termInput.value = cmdHistory[++historyIndex];
                else { historyIndex = cmdHistory.length; termInput.value = ''; }
            }
        });

        updatePrompt();
        appendOutput('Shell ready. Type commands and press Enter.', 'success');
    </script>
</body>
</html>
